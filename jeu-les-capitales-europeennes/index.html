<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Jeu quel est le nom des dix premières capitales d'Europe</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <section>
        <div>
            <h3 id="resultat"></h3>
        </div>
        <div>
        <h1 id="h1-jeu">Jeu quel est le nom des Capitales d'Europe</h1>
        <p>Bienvenue dans le jeu des capitales d'Europe ! </p>
        <p>Le but de ce jeu est de deviner le nom de dix capitales d'Europe !</p>
        <p>Pour jouer, cliquer sur le bouton ci-dessous :</p>
        <p>
        <button type="button" id="boutonStart">Commencer le jeu</button>
        </p>
        </div>
        <div id="questions-reponses">
            <span id="fin-de-jeu">
             <span id="resultat-reponse"></span><br>
             <hr>
             <span id="questions"></span><br>
             <input type="text" id="reponse" placeholder="Entrez votre réponse ici"><br>
             <button type="button" id="boutonValidez">Validez</button> - <button type="button" id="boutonAnnuler">Annuler</button><br><br>
             <button type="button" id="boutonTerminer">Terminer</button><br>
             <span id="score"></span>
            </span>

        </div>

        </section>
        
    </body>
</html>
