<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Calculatrice</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <script src="calculatrice.js" defer></script>
    </head>
    <body>
        <p>Calculatrice</p>
        <div class="ZoneDeSaisie"><label for="chiffres" class="chiffres">Entrer un chiffre : </label><br><input type="text" id="chiffres" value="0"> </div>
        <div class="valeurOperation"><label for="valeurOperation" class="valeurOperation">Entrer +, -, x ou / : </label><br><input type="text" id="valeurOperation" value=""> </div>
        
        <div id="AffichageResultat"><span>Résultat :</span><br> <span id="resultat">0</span> </div>
        <div id="taxe"><label for="taxe">Taxe :</label><br> <input type="text" id="taxe" value="0"></div>
        <div id="affichageTotalTaxe"><span>Total taxe:</span><br><span id="totalTaxe"></span> </div>
        <div id="AffichageSousTotal"><hr><br><span>Sous Total :</span><br><span id="sousTotal"></span> </div>
        <div id="AffichageTotalTtc"><span>Total TTC:</span><br> <span id="Total"></span> </div>
    </body>
</html>
