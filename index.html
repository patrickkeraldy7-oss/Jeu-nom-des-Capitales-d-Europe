
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Afficher un CSV dans HTML</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
    <script src="menu_json.js" defer></script>
</head>
<body>
    <nav id="menu">{le_menu}</nav>
    <h1>Ouvrir un fichier CSV</h1>
    <input type="file" id="csvFile" accept=".csv">
    <div id="output"></div>

    <script>
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) {
                alert("Veuillez sélectionner un fichier CSV.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                displayCSV(text);
            };
            reader.onerror = function() {
                alert("Erreur lors de la lecture du fichier.");
            };
            reader.readAsText(file, 'UTF-8');
        });

        function displayCSV(csvText) {
            // Conversion : Le texte est découpé en lignes (split(/\r?\n/)) puis en colonnes (split(','))
            const rows = csvText.trim().split(/\r?\n/);
            const table = document.createElement('table');

            rows.forEach((row, index) => {
                const tr = document.createElement('tr');
                const cells = row.split(',');

                cells.forEach(cell => {
                    const td = document.createElement(index === 0 ? 'th' : 'td');
                    td.textContent = cell.trim();
                    tr.appendChild(td);
                });

                table.appendChild(tr);
            });

            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = ''; // Nettoyer avant d'afficher
            outputDiv.appendChild(table);
        }
    </script>
</body>
</html>
